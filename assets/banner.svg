<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .particle-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      .particle-float-rev {
        animation: floatRev 7s ease-in-out infinite alternate;
      }
      .stream-flow {
        stroke-dasharray: 8, 12;
        animation: flow 4s linear infinite;
      }
      .orbit-spin {
        transform-origin: 1050px 180px;
        animation: spin 20s linear infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.95); }
        100% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes float {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-16px) translateX(12px); }
      }
      @keyframes floatRev {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(18px) translateX(-10px); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic ambient background elements -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="node-pulse" />
    <circle cx="1060" cy="260" r="160" fill="#a855f7" filter="url(#glow)" class="node-pulse" style="animation-delay: -1.5s;" />
  </g>

  <!-- Animated network streams in background (far right & edges) -->
  <g opacity="0.4">
    <path d="M 750,70 Q 900,120 1100,80" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-flow" />
    <path d="M 800,290 Q 950,220 1150,280" fill="none" stroke="#818cf8" stroke-width="2" class="stream-flow" style="animation-duration: 5s;" />
    <path d="M 900,320 C 1000,240 1020,120 1120,60" fill="none" stroke="#c084fc" stroke-width="1.5" class="stream-flow" style="animation-duration: 6s;" />
  </g>

  <!-- Floating cloud sandbox cluster graphic on right -->
  <g class="orbit-spin" opacity="0.35">
    <circle cx="1050" cy="180" r="100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" />
    <circle cx="1150" cy="180" r="6" fill="#38bdf8" />
    <circle cx="950" cy="180" r="5" fill="#c084fc" />
    <circle cx="1050" cy="80" r="7" fill="#818cf8" />
    <circle cx="1050" cy="280" r="5" fill="#00f2fe" />
  </g>

  <!-- Floating interactive particle nodes on background -->
  <g class="particle-float">
    <circle cx="980" cy="140" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="780" cy="90" r="3" fill="#818cf8" opacity="0.7" />
    <circle cx="850" cy="260" r="5" fill="#c084fc" opacity="0.6" />
  </g>
  <g class="particle-float-rev">
    <circle cx="1120" cy="220" r="4" fill="#00f2fe" opacity="0.8" />
    <circle cx="920" cy="290" r="3" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Pill Badges, Titles & Description -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="275" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CLOUD TEST SANDBOX</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Cloud Test Sandbox
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#e2e8f0">
      Ephemeral Environments • Developer Sandboxes • Test Isolation (EaaS)
    </text>

    <!-- Detailed Capability Line -->
    <text x="0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Curated directory of SaaS testing platforms, microVM sandboxes &amp; open-source orchestration
    </text>

    <!-- Feature Tags Row in Foreground -->
    <g transform="translate(0, 265)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">⚡ MicroVM &amp; VDB</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(142, 0)">
        <rect width="150" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🌐 SaaS Benchmarks</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(304, 0)">
        <rect width="168" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">⭐ Ranked Open-Source</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(484, 0)">
        <rect width="138" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🛡️ Zero-Trust Access</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
</svg>
